name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qa_platform
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d qa_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://qa:qa@localhost:5432/qa_platform
      PG_INTEGRATION_URL: postgres://qa:qa@localhost:5432/qa_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run migrate
      - run: npm test
      - run: npm run build
